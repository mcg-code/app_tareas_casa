<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Subtle glow spot behind icon -->
  <circle cx="256" cy="256" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- House roof silhouette -->
  <path d="M120 230 L256 120 L392 230" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- House body -->
  <path d="M160 230 L160 380 Q160 400 180 400 L332 400 Q352 400 352 380 L352 230" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle top right -->
  <path d="M370 120 L380 145 L405 155 L380 165 L370 190 L360 165 L335 155 L360 145 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>

  <!-- Big glowing Checkmark in the center -->
  <path d="M200 295 L242 337 L318 240" fill="none" stroke="url(#cyanGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>