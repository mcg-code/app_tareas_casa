<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="peachGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffdfd7"/>
      <stop offset="50%" stop-color="#f29e8e"/>
      <stop offset="100%" stop-color="#e88572"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f29e8e" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f29e8e" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- House roof silhouette with smooth rounded cap and corners -->
    <path d="M 100 232 L 256 102 L 412 232" 
          fill="none" 
          stroke="url(#peachGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Subtle House Body Interior Fill (semi-transparent elegant wash) -->
    <path d="M 148 232 L 148 382 C 148 406 166 422 190 422 L 322 422 C 346 422 364 406 364 382 L 364 232 Z" 
          fill="url(#innerGlow)"/>

    <!-- House Walls Outline -->
    <path d="M 148 232 L 148 382 C 148 406 166 422 190 422 L 322 422 C 346 422 364 406 364 382 L 364 232" 
          fill="none" 
          stroke="url(#peachGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Task Checkmark -->
    <path d="M 204 306 L 244 346 L 312 258" 
          fill="none" 
          stroke="url(#peachGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Elegant Sparkle Star (Top Right of Roof) -->
    <path d="M 390 95 Q 390 120 415 120 Q 390 120 390 145 Q 390 120 365 120 Q 390 120 390 95 Z" 
          fill="url(#peachGrad)"/>
    
    <!-- Mini sparkle star (Top Left of Roof) -->
    <path d="M 125 155 Q 125 168 138 168 Q 125 168 125 181 Q 125 168 112 168 Q 125 168 125 155 Z" 
          fill="url(#peachGrad)" 
          opacity="0.8"/>
  </g>
</svg>